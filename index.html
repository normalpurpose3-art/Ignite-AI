<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignite Workspace | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: white; overflow: hidden; font-family: sans-serif; }
        .sidebar { background: #050505; border-right: 1px solid #1a1a1a; }
        .ignite-gradient { background: linear-gradient(135deg, #FF4B2B, #FF416C); }
        .workspace-main { background: radial-gradient(circle at top right, #1a0f0a, #0a0a0a 45%); }
        iframe { border: none; width: 100%; height: 100%; border-radius: 30px; }
    </style>
</head>
<body class="flex h-screen">

    <aside class="sidebar w-72 p-6 hidden md:flex flex-col shadow-2xl">
        <div class="flex items-center gap-3 mb-10 p-2">
            <div class="w-10 h-10 ignite-gradient rounded-xl flex items-center justify-center shadow-lg">🔥</div>
            <span class="font-bold text-lg tracking-tight">Ignite Workspace</span>
        </div>
        <button class="ignite-gradient w-full py-4 rounded-2xl font-bold text-sm shadow-xl hover:scale-[1.02] transition-all flex items-center justify-center gap-2">
            <span class="text-xl">+</span> New Session
        </button>
        <nav class="mt-12 flex-1">
            <h3 class="text-[10px] text-zinc-600 uppercase tracking-[0.2em] font-bold mb-6">Recent History</h3>
            <div class="text-zinc-500 text-sm p-3 bg-white/5 rounded-xl border border-white/5 italic">No history found</div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col workspace-main">
        <header class="flex justify-between items-center px-8 py-8">
            <div>
                <h2 class="text-3xl font-bold tracking-tight">Welcome, <span class="text-orange-500 italic font-black">Professional</span></h2>
                <p class="text-zinc-500 text-[10px] mt-1 tracking-widest uppercase italic">Secure Neural Connection Established</p>
            </div>
            <div class="w-12 h-12 bg-zinc-800 rounded-full border-2 border-orange-500/50 flex items-center justify-center font-bold">N</div>
        </header>

        <div class="flex-1 px-8 pb-8">
            <div class="h-full rounded-[2.5rem] overflow-hidden border border-white/10 shadow-[0_0_50px_rgba(0,0,0,0.5)] bg-black">
                <iframe src="https://normalpurpose3-test.hf.space?__theme=dark"></iframe>
            </div>
        </div>
    </main>
</body>
</html>
